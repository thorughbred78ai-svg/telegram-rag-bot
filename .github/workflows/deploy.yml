
name: Deploy Telegram RAG Bot

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  REGION: asia-east1
  SERVICE_NAME: telegram-rag-bot
  ARTIFACT_REPO: telegram-rag
  IMAGE_NAME: telegram-rag-bot

jobs:

  deploy:

    runs-on: ubuntu-latest

    steps:

      # ------------------------------------------------------
      # Checkout
      # ------------------------------------------------------

      - name: Checkout
        uses: actions/checkout@v4


      # ------------------------------------------------------
      # Google Cloud authentication
      # ------------------------------------------------------

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}


      # ------------------------------------------------------
      # Google Cloud SDK
      # ------------------------------------------------------

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v3


      # ------------------------------------------------------
      # Docker authentication
      # ------------------------------------------------------

      - name: Configure Docker
        run: |
          gcloud auth configure-docker \
            ${{ env.REGION }}-docker.pkg.dev \
            --quiet


      # ------------------------------------------------------
      # Build image
      # ------------------------------------------------------

      - name: Build Docker image
        run: |
          docker build \
            -t ${{ env.REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REPO }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            .


      # ------------------------------------------------------
      # Push image
      # ------------------------------------------------------

      - name: Push Docker image
        run: |
          docker push \
            ${{ env.REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REPO }}/${{ env.IMAGE_NAME }}:${{ github.sha }}


      # ------------------------------------------------------
      # Deploy Cloud Run
      # ------------------------------------------------------

      - name: Deploy Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: ${{ env.SERVICE_NAME }}
          region: ${{ env.REGION }}
          image: ${{ env.REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REPO }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

          flags: >-
            --allow-unauthenticated
            --min-instances=0
            --max-instances=3
            --memory=512Mi
            --cpu=1
            --timeout=300
            --concurrency=20

            --set-env-vars=QDRANT_URL=${{ secrets.QDRANT_URL }},
            QDRANT_COLLECTION=google_drive_rag,
            CHAT_MODEL=${{ vars.CHAT_MODEL }},
            EMBEDDING_MODEL=${{ vars.EMBEDDING_MODEL }},
            EMBEDDING_DIMENSIONS=${{ vars.EMBEDDING_DIMENSIONS }},
            TOP_K=${{ vars.TOP_K }},
            MEMORY_TURNS=${{ vars.MEMORY_TURNS }},
            RATE_LIMIT_REQUESTS=${{ vars.RATE_LIMIT_REQUESTS }},
            RATE_LIMIT_WINDOW_SECONDS=${{ vars.RATE_LIMIT_WINDOW_SECONDS }},
            TELEGRAM_ALLOWED_CHAT_IDS=${{ secrets.TELEGRAM_ALLOWED_CHAT_IDS }},
            TELEGRAM_WEBHOOK_PATH=${{ vars.TELEGRAM_WEBHOOK_PATH }}

            --update-secrets=TELEGRAM_BOT_TOKEN=telegram-bot-token:latest,
            TELEGRAM_WEBHOOK_SECRET=telegram-webhook-secret:latest,
            OPENROUTER_API_KEY=openrouter-api-key:latest,
            QDRANT_API_KEY=qdrant-api-key:latest,
            REDIS_URL=redis-url:latest


      # ------------------------------------------------------
      # Get Cloud Run URL
      # ------------------------------------------------------

      - name: Get Cloud Run URL
        id: url
        run: |
          URL=$(gcloud run services describe \
            ${{ env.SERVICE_NAME }} \
            --region=${{ env.REGION }} \
            --format='value(status.url)')

          echo "url=$URL" >> "$GITHUB_OUTPUT"

          echo "Cloud Run URL:"
          echo "$URL"


      # ------------------------------------------------------
      # Configure Telegram webhook
      # ------------------------------------------------------

      - name: Configure Telegram webhook
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
          CLOUD_RUN_URL: ${{ steps.url.outputs.url }}
          TELEGRAM_WEBHOOK_PATH: ${{ vars.TELEGRAM_WEBHOOK_PATH }}
        run: |

          WEBHOOK_URL="${CLOUD_RUN_URL}/${TELEGRAM_WEBHOOK_PATH}"

          curl --fail-with-body \
            -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/setWebhook" \
            -d "url=${WEBHOOK_URL}" \
            -d "secret_token=${TELEGRAM_WEBHOOK_SECRET}" \
            -d 'allowed_updates=["message"]'

          echo ""
          echo "Telegram webhook configured:"
          echo "${WEBHOOK_URL}"
