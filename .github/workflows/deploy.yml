name: CI/CD - Telegram RAG Bot

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  id-token: write


env:
  SERVICE_NAME: telegram-rag-bot
  REGION: asia-east1
  AR_REPOSITORY: telegram-rag
  IMAGE_NAME: telegram-rag-bot


jobs:

  test:
    name: Test
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile
        run: |
          python -m compileall bot


  build-and-deploy:
    name: Build and Deploy
    needs: test
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v5


      # ------------------------------------------------------
      # Google Cloud authentication
      # ------------------------------------------------------

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}


      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v3


      # ------------------------------------------------------
      # Docker / Artifact Registry
      # ------------------------------------------------------

      - name: Configure Docker
        run: |
          gcloud auth configure-docker \
            ${{ env.REGION }}-docker.pkg.dev \
            --quiet


      - name: Build image
        run: |
          IMAGE="${{ env.REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.AR_REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"

          docker build \
            --tag "$IMAGE" \
            .


      - name: Push image
        run: |
          IMAGE="${{ env.REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.AR_REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"

          docker push "$IMAGE"


      # ------------------------------------------------------
      # Deploy Cloud Run
      # ------------------------------------------------------

      - name: Deploy Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: ${{ env.SERVICE_NAME }}
          region: ${{ env.REGION }}
          image: ${{ env.REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.AR_REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

          flags: >-
            --allow-unauthenticated
            --port=8080
            --memory=512Mi
            --cpu=1
            --timeout=120
            --concurrency=20
            --min-instances=0
            --max-instances=5

          env_vars: |-
            TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}
            TELEGRAM_WEBHOOK_SECRET=${{ secrets.TELEGRAM_WEBHOOK_SECRET }}

            OPENROUTER_API_KEY=${{ secrets.OPENROUTER_API_KEY }}
            OPENROUTER_CHAT_MODEL=qwen/qwen3-1.7b
            OPENROUTER_EMBED_MODEL=baai/bge-m3

            QDRANT_URL=${{ secrets.QDRANT_URL }}
            QDRANT_API_KEY=${{ secrets.QDRANT_API_KEY }}
            QDRANT_COLLECTION=google_drive_rag

            REDIS_URL=${{ secrets.REDIS_URL }}

            ALLOWED_CHAT_IDS=${{ secrets.ALLOWED_CHAT_IDS }}

            TOP_K=5
            SCORE_THRESHOLD=0.4
            MAX_TURNS=6
            MEMORY_TTL=86400
            RATE_LIMIT=8
            RATE_WINDOW=60
            MAX_CONTEXT_CHARS=4500
            MAX_QUESTION_CHARS=1000
            MAX_TELEGRAM_REPLY_CHARS=3500

            OPENROUTER_HTTP_REFERER=https://github.com/${{ github.repository }}
            OPENROUTER_TITLE=Telegram RAG Bot


      # ------------------------------------------------------
      # Configure Telegram webhook
      # ------------------------------------------------------

      - name: Get Cloud Run URL
        id: url
        run: |
          URL="$(gcloud run services describe \
            "${SERVICE_NAME}" \
            --region "${REGION}" \
            --format='value(status.url)')"

          echo "url=$URL" >> "$GITHUB_OUTPUT"

          echo "Cloud Run URL:"
          echo "$URL"


      - name: Configure Telegram webhook
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
          CLOUD_RUN_URL: ${{ steps.url.outputs.url }}
        run: |

          curl --fail-with-body \
            --request POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/setWebhook" \
            --header "Content-Type: application/json" \
            --data "$(jq -n \
              --arg url "${CLOUD_RUN_URL}/telegram/webhook" \
              --arg secret "${TELEGRAM_WEBHOOK_SECRET}" \
              '{
                url: $url,
                secret_token: $secret,
                allowed_updates: ["message"],
                drop_pending_updates: true
              }'
            )"


      # ------------------------------------------------------
      # Smoke test
      # ------------------------------------------------------

      - name: Health check
        env:
          CLOUD_RUN_URL: ${{ steps.url.outputs.url }}
        run: |

          curl \
            --fail \
            --retry 10 \
            --retry-delay 5 \
            --retry-connrefused \
            "${CLOUD_RUN_URL}/health"

          echo
          echo "Deployment successful."
